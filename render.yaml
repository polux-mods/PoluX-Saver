services:
  - type: web
    name: yt-tg-downloader
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
